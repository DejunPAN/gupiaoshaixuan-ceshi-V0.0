name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure compile SDK + build-tools
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore keystore.jks \
            -alias volmatcher \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass volmatcher123 \
            -keypass volmatcher123 \
            -dname "CN=VolMatcher, OU=Dev, O=VolMatcher, L=City, S=State, C=CN"

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon
        env:
          KEYSTORE_PASSWORD: volmatcher123
          KEY_ALIAS: volmatcher
          KEY_PASSWORD: volmatcher123

      - name: Diagnose APK
        if: always()
        run: |
          echo "=== release 目录 ==="
          ls -la app/build/outputs/apk/release/ || true
          APK=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            echo "=== APK 大小 ==="
            du -h "$APK"
            echo "=== APK 类型 ==="
            file "$APK"
            echo "=== APK 内部关键内容 ==="
            unzip -l "$APK" | grep -E "classes.dex|assets/|AndroidManifest.xml|resources.arsc" || true
            echo "=== 结论 ==="
            echo "APK 文件: $APK"
            echo "是否包含代码 classes.dex: $(unzip -l "$APK" | grep -q 'classes.dex' && echo 是 || echo 否)"
            echo "是否包含资源 assets/index.html: $(unzip -l "$APK" | grep -q 'assets/index.html' && echo 是 || echo 否)"
            echo "是否包含资源 assets/matcher.js: $(unzip -l "$APK" | grep -q 'assets/matcher.js' && echo 是 || echo 否)"
          else
            echo "未生成任何 APK 文件（构建失败）"
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VolMatcher-release
          path: app/build/outputs/apk/release/*.apk
