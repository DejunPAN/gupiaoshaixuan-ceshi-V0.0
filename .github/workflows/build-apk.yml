name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore keystore.jks \
            -alias volmatcher \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass volmatcher123 \
            -keypass volmatcher123 \
            -dname "CN=VolMatcher, OU=Dev, O=VolMatcher, L=City, S=State, C=CN"

      - name: Build Release APK
        run: gradle assembleRelease
        env:
          KEYSTORE_PASSWORD: volmatcher123
          KEY_ALIAS: volmatcher
          KEY_PASSWORD: volmatcher123

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VolMatcher-release
          path: app/build/outputs/apk/release/*.apk
