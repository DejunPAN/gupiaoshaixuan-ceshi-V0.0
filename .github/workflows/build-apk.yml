name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "Using Android SDK root: $ANDROID_SDK_ROOT"
          mkdir -p "$ANDROID_SDK_ROOT"
          SDKMANAGER=""
          if [ -d "$ANDROID_SDK_ROOT/cmdline-tools" ]; then
            SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -n 1 || true)
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "cmdline-tools not found, downloading commandlinetools"
            wget -q -O /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
            if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" ]; then
              rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"
              mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            fi
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          echo "$ANDROID_SDK_ROOT" > /tmp/android_root.txt

      - name: Install Android platform + build-tools
        run: |
          export ANDROID_SDK_ROOT="$(cat /tmp/android_root.txt)"
          SDKMANAGER=""
          if [ -d "$ANDROID_SDK_ROOT/cmdline-tools" ]; then
            SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -n 1 || true)
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager missing; trying PATH"
            command -v sdkmanager && SDKMANAGER="sdkmanager"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found under $ANDROID_SDK_ROOT/cmdline-tools"
            exit 1
          fi
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore keystore.jks \
            -alias volmatcher \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass volmatcher123 \
            -keypass volmatcher123 \
            -dname "CN=VolMatcher, OU=Dev, O=VolMatcher, L=City, S=State, C=CN"

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon
        env:
          KEYSTORE_PASSWORD: volmatcher123
          KEY_ALIAS: volmatcher
          KEY_PASSWORD: volmatcher123

      - name: Diagnose APK
        if: always()
        run: |
          echo "=== release 目录 ==="
          ls -la app/build/outputs/apk/release/ || true
          APK=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            echo "=== APK 大小 ==="
            du -h "$APK"
            echo "=== APK 类型 ==="
            file "$APK"
            echo "=== APK 内部关键内容 ==="
            unzip -l "$APK" | grep -E "classes.dex|assets/|AndroidManifest.xml|resources.arsc" || true
            echo "=== 结论 ==="
            echo "APK 文件: $APK"
            echo "是否包含代码 classes.dex: $(unzip -l "$APK" | grep -q 'classes.dex' && echo 是 || echo 否)"
            echo "是否包含资源 assets/index.html: $(unzip -l "$APK" | grep -q 'assets/index.html' && echo 是 || echo 否)"
            echo "是否包含资源 assets/matcher.js: $(unzip -l "$APK" | grep -q 'assets/matcher.js' && echo 是 || echo 否)"
          else
            echo "未生成任何 APK 文件（构建失败）"
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VolMatcher-release
          path: app/build/outputs/apk/release/*.apk
