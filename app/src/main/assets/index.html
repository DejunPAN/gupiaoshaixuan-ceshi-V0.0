<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>量形选股</title>
<style>
  :root {
    --bg: #1a1a2e;
    --panel: #16213e;
    --panel2: #0f3460;
    --accent: #00d26a;
    --red: #ff4757;
    --text: #eaeaea;
    --muted: #8a93a8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 12px 12px 40px;
    min-height: 100vh;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
  .card {
    background: var(--panel);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .card h2 { font-size: 14px; color: var(--accent); margin-bottom: 10px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 3px; }
  input {
    width: 100%; padding: 7px 8px; border-radius: 6px;
    border: 1px solid #2c3e66; background: #0d1b2a; color: var(--text);
    font-size: 13px;
  }
  input:focus { outline: 1px solid var(--accent); }
  button {
    width: 100%; padding: 12px; border: 0; border-radius: 8px;
    background: var(--accent); color: #062; font-size: 15px; font-weight: 600;
    cursor: pointer; margin-top: 10px;
  }
  button:disabled { background: #555; color: #999; cursor: not-allowed; }
  .btn-row { display: flex; gap: 8px; }
  .btn-row button { margin-top: 0; }
  .btn-ghost { background: var(--panel2); color: var(--text); }
  .progress {
    margin-top: 10px; font-size: 12px; color: var(--muted); display: none;
  }
  .progress .bar { height: 6px; background: #0d1b2a; border-radius: 3px; margin-top: 5px; overflow: hidden; }
  .progress .fill { height: 100%; background: var(--accent); width: 0%; transition: width .2s; }
  .stat { font-size: 12px; color: var(--muted); margin-top: 8px; display: none; }
  .result-item {
    background: var(--panel2); border-radius: 8px; padding: 10px 12px;
    margin-bottom: 8px; cursor: pointer;
  }
  .result-item .top { display: flex; justify-content: space-between; align-items: center; }
  .result-item .name { font-size: 15px; font-weight: 600; }
  .result-item .score { color: var(--accent); font-weight: 700; font-size: 16px; }
  .result-item .meta { font-size: 11px; color: var(--muted); margin-top: 4px; line-height: 1.5; }
  .tag { display: inline-block; background: #0d1b2a; border-radius: 4px; padding: 1px 6px; font-size: 10px; margin-right: 4px; color: #c9d1e0; }
  .chart { font-family: monospace; font-size: 7px; line-height: 1.15; color: var(--accent); background: #0d1b2a; border-radius: 6px; padding: 8px; margin-top: 6px; overflow-x: auto; white-space: pre; }
  .kline { display: none; margin-top: 8px; }
  .kline canvas { width: 100%; height: 160px; background: #0d1b2a; border-radius: 6px; }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 20px; }

  /* Toast */
  .toast {
    position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%);
    background: rgba(0,0,0,.82); color: #fff; font-size: 13px;
    padding: 10px 18px; border-radius: 20px; z-index: 99;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .toast.show { opacity: 1; }

  /* 导出弹窗 */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.6);
    display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50;
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: var(--panel); border-radius: 12px; padding: 16px; width: 100%; max-width: 480px;
  }
  .modal h3 { font-size: 15px; color: var(--accent); margin-bottom: 10px; }
  .modal textarea {
    width: 100%; height: 200px; background: #0d1b2a; color: var(--text);
    border: 1px solid #2c3e66; border-radius: 6px; padding: 8px; font-size: 12px;
    font-family: monospace; resize: none;
  }
  .modal .hint { font-size: 11px; color: var(--muted); margin: 8px 0; line-height: 1.5; }
</style>
</head>
<body>
  <h1>量形选股</h1>
  <div class="sub">双爆量 + 缩量转增 形态匹配 · 全市场扫描</div>

  <div class="card">
    <h2>形态参数</h2>
    <div class="grid">
      <div><label>爆量倍数 SURGE_RATIO</label><input id="p_surge" type="number" step="0.1" value="1.8"></div>
      <div><label>均量窗口 MA_WINDOW</label><input id="p_ma" type="number" value="10"></div>
      <div><label>连跌天数 FALL_DAYS</label><input id="p_fall" type="number" value="2"></div>
      <div><label>一日游阈值 SUSTAIN</label><input id="p_sustain" type="number" step="0.1" value="1.5"></div>
      <div><label>今日量占峰值上限</label><input id="p_peak" type="number" step="0.05" value="0.80"></div>
      <div><label>股价上限 MAX_PRICE</label><input id="p_price" type="number" value="70"></div>
    </div>
    <button id="btnScan">开始全市场扫描</button>
    <div class="progress" id="progress">
      <div id="progressText">准备中...</div>
      <div class="bar"><div class="fill" id="progressFill"></div></div>
    </div>
    <div class="stat" id="stat"></div>
  </div>

  <div class="card">
    <h2>匹配结果 <span style="color:var(--muted);font-weight:400;" id="resultCount"></span></h2>
    <div class="btn-row" id="exportRow" style="display:none;">
      <button id="btnExport" class="btn-ghost">导出通达信清单</button>
    </div>
    <div id="results"><div class="empty">点击「开始扫描」后结果显示在这里</div></div>
  </div>

  <!-- 导出弹窗 -->
  <div class="modal-mask" id="exportMask">
    <div class="modal">
      <h3>通达信自选导入清单</h3>
      <textarea id="exportText" readonly></textarea>
      <div class="hint">每行一个代码（带 sh/sz 前缀）。在通达信电脑版：自选股 → 右键「自选股设置 / 导入」→ 选择此文本文件即可。手机点「分享」可唤起系统面板，选「通达信」直接导入（若通达信未出现在分享列表，请改用「复制」后粘贴到通达信的添加框）。</div>
      <div class="btn-row">
        <button id="btnCopy">复制</button>
        <button id="btnShare" class="btn-ghost">分享</button>
        <button id="btnClose" class="btn-ghost">关闭</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script src="matcher.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  let LAST_RESULTS = [];

  const pids = {
    SURGE_RATIO: 'p_surge', MA_WINDOW: 'p_ma', FALL_DAYS: 'p_fall',
    SUSTAIN_RATIO: 'p_sustain', TODAY_PEAK_RATIO: 'p_peak', MAX_PRICE: 'p_price',
  };

  function showToast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 1800);
  }

  function readCfg() {
    CFG.SURGE_RATIO = parseFloat($('p_surge').value) || 1.8;
    CFG.MA_WINDOW = parseInt($('p_ma').value) || 10;
    CFG.FALL_DAYS = parseInt($('p_fall').value) || 2;
    CFG.SUSTAIN_RATIO = parseFloat($('p_sustain').value) || 1.5;
    CFG.TODAY_PEAK_RATIO = parseFloat($('p_peak').value) || 0.8;
    CFG.MAX_PRICE = parseFloat($('p_price').value) || 70;
  }

  function setProgress(shown, text, pct) {
    $('progress').style.display = shown ? 'block' : 'none';
    if (text != null) $('progressText').textContent = text;
    if (pct != null) $('progressFill').style.width = pct + '%';
  }

  function fmt(n) { return n == null ? '-' : n.toLocaleString('zh-CN'); }

  function asciiChart(vols) {
    const h = 8;
    const mx = Math.max(...vols) || 1;
    const norm = vols.map(v => Math.round(v / mx * h));
    let out = '';
    for (let r = h; r > 0; r--) {
      out += norm.map(n => (n >= r ? '#' : ' ')).join('') + '\n';
    }
    return out;
  }

  function drawCandle(canvas, k) {
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);
    const n = k.closes.length;
    if (!n) return;
    const allHigh = Math.max(...k.highs);
    const allLow = Math.min(...k.lows);
    const pad = 6;
    const range = (allHigh - allLow) || 1;
    const cw = (W - pad * 2) / n;
    const bw = Math.max(1, cw * 0.6);
    for (let i = 0; i < n; i++) {
      const x = pad + i * cw + cw / 2;
      const yH = pad + (allHigh - k.highs[i]) / range * (H - pad * 2);
      const yL = pad + (allHigh - k.lows[i]) / range * (H - pad * 2);
      const yO = pad + (allHigh - k.opens[i]) / range * (H - pad * 2);
      const yC = pad + (allHigh - k.closes[i]) / range * (H - pad * 2);
      const up = k.closes[i] >= k.opens[i];
      ctx.strokeStyle = up ? '#ff4757' : '#00d26a'; // 涨红跌绿(中国习惯)
      ctx.fillStyle = ctx.strokeStyle;
      ctx.beginPath(); ctx.moveTo(x, yH); ctx.lineTo(x, yL); ctx.stroke();
      const top = Math.min(yO, yC);
      const hgt = Math.max(1, Math.abs(yC - yO));
      ctx.fillRect(x - bw / 2, top, bw, hgt);
    }
  }

  function renderResults(results) {
    const box = $('results');
    LAST_RESULTS = results;
    $('resultCount').textContent = results.length ? `(${results.length} 只命中)` : '';
    $('exportRow').style.display = results.length ? 'flex' : 'none';
    if (!results.length) {
      box.innerHTML = '<div class="empty">无命中。可尝试放宽 SURGE_RATIO 或缩短 FALL_DAYS。</div>';
      return;
    }
    box.innerHTML = results.slice(0, 100).map((r, idx) => {
      const matched = r.matched;
      const tags = [
        `<span class="tag">${r.code}</span>`,
        `<span class="tag">¥${r.price != null ? r.price.toFixed(2) : '-'}</span>`,
        `<span class="tag">爆1:${r.ratio1}x</span>`,
        `<span class="tag">爆2:${r.ratio2}x</span>`,
        `<span class="tag">连跌${r.fall_len}天</span>`,
        `<span class="tag">今+${r.today_chg}%</span>`,
      ].join('');
      const vol = matched ? `<div class="chart">${asciiChart(r.volumes)}</div>` : '';
      return `<div class="result-item" data-idx="${idx}">
        <div class="top"><span class="name">${r.name || r.code}</span>
          <span class="score">${r.score}</span></div>
        <div class="meta">${tags}</div>
        ${vol}
        <div class="kline"><canvas width="600" height="160"></canvas></div>
      </div>`;
    }).join('');

    box.querySelectorAll('.result-item').forEach(el => {
      el.addEventListener('click', () => {
        const kline = el.querySelector('.kline');
        const open = kline.style.display === 'block';
        kline.style.display = open ? 'none' : 'block';
        if (!open) {
          const r = LAST_RESULTS[parseInt(el.dataset.idx, 10)];
          if (r && r.kline) drawCandle(kline.querySelector('canvas'), r.kline);
        }
      });
    });
  }

  $('btnScan').addEventListener('click', async () => {
    readCfg();
    const btn = $('btnScan');
    btn.disabled = true;
    setProgress(true, '第一步：粗筛全市场（拉取名称+现价）...', 2);

    const t0 = Date.now();
    const { filtered } = await VolMatcher.coarseFilter((done, total) => {
      setProgress(true, `第一步：粗筛中 ${done}/${total}`, 2 + Math.round(done / total * 28));
    });
    $('stat').style.display = 'block';
    $('stat').textContent = `粗筛完成：全市场活跃股 → 过滤 ST/高价后 ${filtered.length} 只候选，开始精筛...`;
    setProgress(true, `第二步：精筛 ${filtered.length} 只（拉K线+判定形态）...`, 30);

    const results = await VolMatcher.fineScan(filtered, (idx, total) => {
      const pct = 30 + Math.round(idx / total * 68);
      setProgress(true, `精筛中 ${idx}/${total}`, pct);
    });

    const matched = results.filter(r => r.matched);
    setProgress(false);
    $('stat').textContent =
      `完成：候选 ${filtered.length} 只，符合全部规则 ${matched.length} 只，耗时 ${((Date.now() - t0) / 1000).toFixed(0)} 秒`;
    renderResults(matched);
    btn.disabled = false;
  });

  // ---------- 导出 ----------
  function openExport() {
    const text = VolMatcher.exportTdxText(LAST_RESULTS, false);
    $('exportText').value = text;
    $('exportMask').classList.add('show');
  }
  $('btnExport').addEventListener('click', openExport);
  $('btnClose').addEventListener('click', () => $('exportMask').classList.remove('show'));
  $('exportMask').addEventListener('click', (e) => {
    if (e.target === $('exportMask')) $('exportMask').classList.remove('show');
  });
  $('btnCopy').addEventListener('click', async () => {
    const text = $('exportText').value;
    try {
      await navigator.clipboard.writeText(text);
      showToast('已复制到剪贴板');
    } catch (e) {
      // 部分 WebView 不支持 clipboard API, 兜底用 execCommand
      try {
        const ta = $('exportText');
        ta.removeAttribute('readonly');
        ta.select();
        document.execCommand('copy');
        ta.setAttribute('readonly', '');
        showToast('已复制到剪贴板');
      } catch (e2) {
        showToast('复制失败，请长按手动选择');
      }
    }
  });
  $('btnShare').addEventListener('click', () => {
    const text = $('exportText').value;
    if (window.NativeData && window.NativeData.shareText) {
      window.NativeData.shareText(text); // 唤起系统分享面板
    } else if (navigator.share) {
      navigator.share({ title: '量形选股结果', text }).catch(() => {});
    } else {
      showToast('当前环境不支持分享，请改用「复制」');
    }
  });
})();
</script>
</body>
</html>
